name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: stedi
          target: ${{ matrix.target }}
          archive: stedi-$target
          checksum: sha256
          tar: unix
          zip: windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-formula:
    name: Update Homebrew formula
    needs: upload-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rewrite Formula/stedi.rb from release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          sha() {
            local target="$1"
            gh release download "$TAG" --pattern "stedi-${target}.tar.gz.sha256" --output - \
              | awk '{print $1}'
          }

          MAC_ARM=$(sha aarch64-apple-darwin)
          MAC_X86=$(sha x86_64-apple-darwin)
          LIN_ARM=$(sha aarch64-unknown-linux-gnu)
          LIN_X86=$(sha x86_64-unknown-linux-gnu)

          cat > Formula/stedi.rb <<EOF
          class Stedi < Formula
            desc "Agent-friendly CLI for the Stedi APIs, driven by the official OpenAPI specs"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/stedi-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM}"
              end
              on_intel do
                url "${base}/stedi-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X86}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/stedi-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LIN_ARM}"
              end
              on_intel do
                url "${base}/stedi-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LIN_X86}"
              end
            end

            def install
              bin.install "stedi"
            end

            test do
              assert_match "stedi", shell_output("#{bin}/stedi --version")
            end
          end
          EOF

      - name: Commit formula
        run: |
          set -euo pipefail
          if git diff --quiet Formula/stedi.rb; then
            echo "Formula unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/stedi.rb
          git commit -m "chore: update Homebrew formula for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
