[package]
name = "stedi"
version = "0.2.0"
edition = "2021"
description = "Agent-friendly CLI for the Stedi APIs, driven by the official OpenAPI specs."
authors = ["Taiga <engineering@usetaiga.com>"]
license = "MIT"
repository = "https://github.com/useTaiga/stedi-cli"
homepage = "https://github.com/useTaiga/stedi-cli"
documentation = "https://github.com/useTaiga/stedi-cli#readme"
readme = "README.md"
keywords = ["stedi", "openapi", "cli", "healthcare", "edi"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "stedi"
path = "src/main.rs"

[dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
ureq = { version = "2", features = ["json"] }
toml = "0.8"
jaq-core = "2"
jaq-std = "2"
jaq-json = { version = "1", features = ["serde_json"] }
comfy-table = "7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
